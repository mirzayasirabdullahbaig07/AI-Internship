<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LoginForm demo - Day 11 + Day 12 fix</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f1f3f9;
        color: #1b2240;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgb(27 34 64 / 10%);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.2rem;
      }
      p.note {
        margin: 0 0 16px;
        color: #5a6280;
        font-size: 0.88rem;
      }
      form {
        display: grid;
        gap: 10px;
      }
      input {
        font: inherit;
        padding: 10px;
        border: 1.5px solid #b9bfd6;
        border-radius: 8px;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: #2f4bd6;
        color: #fff;
        cursor: pointer;
      }
      form p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Log in</h1>
      <p class="note">
        Day 11 LoginForm, calling the fixed <code>/api/profile</code> with a bearer token
        (no user id sent).
      </p>
      <div id="root"></div>
    </div>
    <script src="/dist/loginform.js"></script>
  </body>
</html>
